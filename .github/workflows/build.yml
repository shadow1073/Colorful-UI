name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Pin BepInEx version
        run: |
          cat > Directory.Build.props << 'EOF'
          <Project>
            <ItemGroup>
              <PackageReference Update="BepInEx.Unity.IL2CPP" Version="6.0.0-be.692" />
            </ItemGroup>
          </Project>
          EOF

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Collect DLL + source
        run: |
          mkdir -p package
          cp bin/Release/net6.0/ColorfulUI.dll package/
          find . -name "*.cs" -not -path "./bin/*" -not -path "./obj/*" \
            -exec cp --parents {} package/ \;
          cd package && zip -r ../ColorfulUI-dll-and-source.zip . && cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorfulUI
          path: |
            bin/Release/net6.0/ColorfulUI.dll
            ColorfulUI-dll-and-source.zip
          if-no-files-found: error

      - name: Attach files to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net6.0/ColorfulUI.dll
            ColorfulUI-dll-and-source.zip
