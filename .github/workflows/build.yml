name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore dependencies
        run: dotnet restore ColorfulUI/ColorfulUI.csproj --configfile ColorfulUI/nuget.config

      - name: Build
        run: >
          dotnet build ColorfulUI/ColorfulUI.csproj
          --configuration Release
          --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorfulUI
          path: ColorfulUI/bin/Release/net6.0/ColorfulUI.dll
          if-no-files-found: error

      - name: Attach DLL to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ColorfulUI/bin/Release/net6.0/ColorfulUI.dll
